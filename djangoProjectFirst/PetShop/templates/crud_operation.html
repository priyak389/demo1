<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crud Operation</title>
    <style>
        table{
            border:solid 2px black;
        }
    </style>
</head>
<body>
   
    <table>
        <tr><th>Crud Operation</th></tr>
        <form action="" method="POST">
            {% csrf_token %}
        <tr>
            <td><label for="">Enter Customer Id</label></td>
            <td> <input type="number" name="custid"></td>
          
        </tr>
        <tr>
            <td><label for="">Enter Customer name:</label></td>
            <td> <input type="text" name="custname"></td>
        </tr>
        <tr><td>Enter Email:</td>
            <td><input type="email" name="custemail">
        </td></tr>
        <tr>
            <td><label for="">Enter contact:</label></td>
            <td><input type="number" name="custcontact"></td>
        </tr>
        <tr><td><input type="submit"></td></tr>

    </form>
    </table>
    
</body>
</html>
